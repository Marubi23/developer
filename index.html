<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Meta -->
    <title>Felix Marubi · builder</title>
    <meta name="description" content="Felix Marubi — building things that matter. CEO @ Marubi-Labs." />
    <meta name="author" content="Felix Marubi" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Felix Marubi" />
    <meta property="og:description" content="building things that matter." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        /* ========== RESET & BASE ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            color: #e8e4df;
            min-height: 100vh;
            line-height: 1.6;
            padding: 2rem;
        }
        
        /* ========== LAYOUT ========== */
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        /* ========== NAV ========== */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0 4rem;
            width: 100%;
        }
        
        .logo {
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #cc2f01;
        }
        
        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        
        .nav-links a {
            color: #a09b96;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        
        .nav-links a:hover {
            color: #e8e4df;
        }
        
        /* ========== HERO ========== */
        .hero {
            padding: 0.5rem 0 3rem;
        }
        
        .badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #cc2f01;
            border: 1px solid #cc2f0120;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }
        
        h1 .highlight {
            color: #cc2f01;
        }
        
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #a09b96;
            max-width: 520px;
            margin-bottom: 2.5rem;
            font-weight: 400;
            line-height: 1.8;
        }
        
        /* ========== BUTTONS ========== */
        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 3.5rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-primary {
            background: #cc2f01;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #b82800;
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: transparent;
            color: #e8e4df;
            border: 1px solid #e8e4df30;
        }
        
        .btn-outline:hover {
            border-color: #cc2f01;
            color: #cc2f01;
            transform: translateY(-2px);
        }
        
        /* ========== STATS ========== */
        .stats {
            display: flex;
            gap: 4rem;
            padding: 1.5rem 0;
            border-top: 1px solid #ffffff08;
            border-bottom: 1px solid #ffffff08;
            margin-bottom: 3rem;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        
        .stat-number {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e8e4df;
        }
        
        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a09b96;
        }
        
        /* ========== SOCIALS ========== */
        .socials {
            display: flex;
            gap: 1.5rem;
        }
        
        .socials a {
            color: #a09b96;
            font-size: 1.1rem;
            transition: color 0.2s;
        }
        
        .socials a:hover {
            color: #e8e4df;
        }
        
        /* ========== FOOTER ========== */
        .footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #ffffff08;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #a09b96;
        }
        
        .footer a {
            color: #a09b96;
            text-decoration: none;
        }
        
        .footer a:hover {
            color: #cc2f01;
        }
        
        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            body { padding: 1.5rem; }
            .stats { flex-direction: column; gap: 1rem; }
            .nav-links { gap: 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn { justify-content: center; }
            h1 { font-size: clamp(2.8rem, 10vw, 4rem); }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- NAV -->
    <nav>
        <span class="logo">Marubi-Labs</span>
        <ul class="nav-links">
            <li><a href="#">Work</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    
    <!-- HERO -->
    <section class="hero">
        <span class="badge">✦ Your Favourite Tech Geek</span>
        
        <h1>
            Marubi <span class="highlight">Labs</span>
        </h1>
        
        <p class="subtitle">
            Software Engineer · DevOps · Mobile Developer · Innovator · Startup Founder
        </p>
        
        <div class="btn-group">
            <a href="#" class="btn btn-primary">
                <i class="fas fa-arrow-right"></i> See Work
            </a>
            <a href="#" class="btn btn-outline">
                <i class="fas fa-paper-plane"></i> Connect
            </a>
        </div>
        
        <!-- STATS -->
  
        
        <!-- SOCIALS -->
        <div class="socials">
            <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </section>
    
    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 · <a href="#">Marubi-Labs</a> · built with <i class="fas fa-heart" style="color:#cc2f01; font-size:0.7rem;"></i></p>
    </footer>
    
</div>

</body>
</html>
